[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app.py", "config.py", "models", "routes", "services", "utils"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
